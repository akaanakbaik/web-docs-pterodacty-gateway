name: 🤖 AI Auto-Fix ALL PR Issues

on:
  schedule:
    - cron: '*/5 * * * *'  # Cek setiap 5 menit
  workflow_dispatch:  # Manual trigger
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pr: [0]  # Akan diisi dinamis
    
    steps:
      - name: 🎯 Get ALL Open PRs
        id: get-prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });
            
            console.log(`📊 Total open PRs: ${prs.length}`);
            
            const problematicPRs = [];
            
            for (const pr of prs) {
              console.log(`🔍 Checking PR #${pr.number}: ${pr.title}`);
              
              // Cek merge conflict (REAL CHECK)
              let hasConflict = false;
              let conflictFiles = [];
              
              try {
                const { data: prDetail } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });
                
                hasConflict = prDetail.mergeable === false || prDetail.mergeable_state === 'dirty';
                
                if (hasConflict) {
                  const { data: files } = await github.rest.pulls.listFiles({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number
                  });
                  
                  // Filter file yang beneran conflict
                  for (const file of files) {
                    if (file.status === 'modified' && file.patch) {
                      if (file.patch.includes('<<<<<<<') || file.patch.includes('>>>>>>>')) {
                        conflictFiles.push({
                          filename: file.filename,
                          patch: file.patch.substring(0, 1000) // ambil 1000 chars pertama
                        });
                      }
                    }
                  }
                }
              } catch (e) {
                console.log(`⚠️ Error check PR #${pr.number}: ${e.message}`);
              }
              
              // Cek failed status checks
              let failedChecks = [];
              try {
                const { data: checks } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha
                });
                
                failedChecks = checks.check_runs
                  .filter(c => c.status === 'completed' && c.conclusion === 'failure')
                  .map(c => ({ name: c.name, details: c.output?.title || 'No details' }));
              } catch (e) {
                console.log(`⚠️ Error checks PR #${pr.number}: ${e.message}`);
              }
              
              if (hasConflict || failedChecks.length > 0) {
                problematicPRs.push({
                  number: pr.number,
                  title: pr.title,
                  branch: pr.head.ref,
                  repoFullName: pr.head.repo.full_name,
                  hasConflict: hasConflict,
                  conflictFiles: conflictFiles,
                  failedChecks: failedChecks,
                  lastUpdate: pr.updated_at
                });
              }
            }
            
            console.log(`🚨 Problematic PRs found: ${problematicPRs.length}`);
            core.setOutput('total', problematicPRs.length);
            core.setOutput('prs', JSON.stringify(problematicPRs));
            
            return problematicPRs;

      - name: 🤖 Fix Each PR with AI
        if: fromJSON(steps.get-prs.outputs.prs).length > 0
        run: |
          echo '🔥 STARTING AI FIX FOR ALL PROBLEMATIC PRS'
          echo '${{ steps.get-prs.outputs.prs }}' | jq -c '.[]' | while read pr; do
            PR_NUMBER=$(echo $pr | jq -r '.number')
            echo "========================================="
            echo "🔧 FIXING PR #$PR_NUMBER"
            echo "========================================="
            
            # Setup git
            git config --global user.name "AI Auto-Fix Bot"
            git config --global user.email "ai-fix@github-action.local"
            
            # Clone repo with depth
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
            cd repo
            
            # Fetch PR branch
            PR_BRANCH=$(echo $pr | jq -r '.branch')
            git fetch origin pull/$PR_NUMBER/head:$PR_BRANCH
            git checkout $PR_BRANCH
            
            # Get base branch
            BASE_BRANCH=$(gh pr view $PR_NUMBER --json baseRefName --jq '.baseRefName')
            git fetch origin $BASE_BRANCH
            
            # Prepare AI context
            HAS_CONFLICT=$(echo $pr | jq -r '.hasConflict')
            CONFLICT_FILES=$(echo $pr | jq -r '.conflictFiles | map(.filename) | join(", ")')
            FAILED_CHECKS=$(echo $pr | jq -r '.failedChecks | map(.name) | join(", ")')
            
            # Create system prompt untuk AI
            SYSTEM_PROMPT="Anda adalah AI GitHub expert. Tugas: Perbaiki masalah pull request #$PR_NUMBER.
            \nMASALAH:"
            if [ "$HAS_CONFLICT" = "true" ]; then
              SYSTEM_PROMPT="$SYSTEM_PROMPT\n- MERGE CONFLICT di file: $CONFLICT_FILES"
            fi
            if [ -n "$FAILED_CHECKS" ]; then
              SYSTEM_PROMPT="$SYSTEM_PROMPT\n- FAILED CHECKS: $FAILED_CHECKS"
            fi
            
            SYSTEM_PROMPT="$SYSTEM_PROMPT\n\nINSTRUKSI: Berikan jawaban dalam format JSON EXACT:\n
            {\n
              \"action\": \"fix_merge|fix_tests|both\",\n
              \"git_commands\": [\"git merge --abort\", \"git checkout --theirs file.js\"],\n
              \"file_fixes\": [{\"path\": \"src/app.js\", \"search\": \"<<<<<<< HEAD\\\\nold code\\\\n=======\\\\nnew code\\\\n>>>>>>> branch\", \"replace\": \"fixed code\"}],\n
              \"explanation\": \"penjelasan singkat bahasa Indonesia\",\n
              \"confidence\": 0.95\n
            }\n
            HANYA JSON, tidak ada teks lain!"
            
            ENCODE_SYSTEM=$(echo -e "$SYSTEM_PROMPT" | jq -sRr @uri)
            
            # Call API dengan timeout dan retry
            echo "📡 Calling AI API (DeepSeek)..."
            AI_RESPONSE=""
            for i in 1 2 3; do
              RESPONSE=$(curl -s --max-time 50 \
                "https://api.cuki.biz.id/api/ai/deepseek?apikey=cuki-x&question=$ENCODE_SYSTEM" || echo "")
              
              if echo "$RESPONSE" | jq -e '.data.response' > /dev/null 2>&1; then
                AI_RESPONSE=$(echo "$RESPONSE" | jq -r '.data.response')
                echo "✅ AI DeepSeek berhasil (attempt $i)"
                break
              else
                echo "⚠️ Attempt $i gagal, fallback ke GPT..."
                RESPONSE_GPT=$(curl -s --max-time 50 \
                  "https://api.cuki.biz.id/api/ai/gpt?apikey=cuki-x&question=$ENCODE_SYSTEM" || echo "")
                
                if echo "$RESPONSE_GPT" | jq -e '.results' > /dev/null 2>&1; then
                  AI_RESPONSE=$(echo "$RESPONSE_GPT" | jq -r '.results')
                  echo "✅ AI GPT berhasil (attempt $i)"
                  break
                fi
              fi
              sleep 5
            done
            
            if [ -z "$AI_RESPONSE" ]; then
              echo "❌ AI gagal setelah 3 attempt"
              gh pr comment $PR_NUMBER --body "❌ **AI Fix Failed**\n\nTidak bisa connect ke AI service. Silakan perbaiki manual."
              continue
            fi
            
            # Parse dan execute AI response
            echo "$AI_RESPONSE" | jq -r '.git_commands[]' 2>/dev/null | while read cmd; do
              echo "⚙️ Running: $cmd"
              eval $cmd || echo "⚠️ Command failed: $cmd"
            done
            
            # Fix file conflicts
            echo "$AI_RESPONSE" | jq -c '.file_fixes[]' 2>/dev/null | while read fix; do
              FILE_PATH=$(echo $fix | jq -r '.path')
              SEARCH=$(echo $fix | jq -r '.search')
              REPLACE=$(echo $fix | jq -r '.replace')
              
              if [ -f "$FILE_PATH" ]; then
                # Ganti konten file
                sed -i "s|$SEARCH|$REPLACE|g" "$FILE_PATH"
                git add "$FILE_PATH"
                echo "✅ Fixed: $FILE_PATH"
              fi
            done
            
            # Commit dan push jika ada perubahan
            if ! git diff --cached --quiet; then
              EXPLANATION=$(echo "$AI_RESPONSE" | jq -r '.explanation')
              git commit -m "🤖 AI Auto-Fix: $EXPLANATION"
              git push origin HEAD:$PR_BRANCH --force-with-lease
              
              # Comment di PR
              gh pr comment $PR_NUMBER --body "✅ **AI Auto-Fix Applied**\n\n📝 $EXPLANATION\n\n🔄 Workflow akan re-run checks..."
              
              # Re-trigger checks dengan update PR description
              gh pr edit $PR_NUMBER --body "🤖 AI Auto-Fixed at $(date '+%Y-%m-%d %H:%M:%S')\n\n$(gh pr view $PR_NUMBER --json body --jq '.body')"
            else
              echo "ℹ️ Tidak ada perubahan yang diperlukan"
              gh pr comment $PR_NUMBER --body "ℹ️ **AI Analysis**\n\nTidak ada perbaikan otomatis yang bisa dilakukan. Konflik/permasalahan memerlukan intervensi manual."
              gh pr edit $PR_NUMBER --add-label "manual-fix-needed"
            fi
            
            cd ../..
            rm -rf repo
          done

      - name: 📊 Summary Report
        if: always()
        run: |
          echo "## 🤖 AI Auto-Fix Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Workflow completed at $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "📊 Checked all open PRs for issues" >> $GITHUB_STEP_SUMMARY